name: ISR cache prefetch

# 매 5분 인덱스/대시보드 + top 9 종목 페이지 fetch — Next.js ISR cache (revalidate 300/60s) 갱신.
# 첫 사용자 진입도 cache hit 보장.
#
# 이전 /api/cron/warmup route 는 KV listQuotes warmup 용도였으나 인덱스가 D1 우선으로
# 전환되며 dead code 가 되어 제거. ISR 갱신만 페이지 fetch 로 처리.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prefetch ISR pages
        env:
          SITE: https://trading.jdgrid.com
        run: |
          # 대시보드 / 3 자산군 인덱스 (revalidate=300) + top 9 종목 (revalidate=60).
          pages=(
            "/ko"
            "/ko/crypto" "/ko/us" "/ko/kr"
            "/ko/crypto/btc" "/ko/crypto/eth" "/ko/crypto/sol"
            "/ko/us/aapl" "/ko/us/nvda" "/ko/us/tsla"
            "/ko/kr/005930" "/ko/kr/000660" "/ko/kr/373220"
          )
          for p in "${pages[@]}"; do
            t=$(curl -s -o /dev/null -w "%{time_total}" --max-time 30 "$SITE$p" || echo "TIMEOUT")
            echo "  ${t}s  $p"
          done
