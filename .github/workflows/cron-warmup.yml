name: ISR cache prefetch

# 매 5분 인덱스/대시보드 + top 9 종목 페이지 fetch — Next.js ISR cache (revalidate 300/60s) 갱신.
# 첫 사용자 진입도 cache hit 보장.
#
# 이전 /api/cron/warmup route 는 KV listQuotes warmup 용도였으나 인덱스가 D1 우선으로
# 전환되며 dead code 가 되어 제거. ISR 갱신만 페이지 fetch 로 처리.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prefetch ISR pages
        env:
          SITE: https://trading.jdgrid.com
        run: |
          # 대시보드 + 3 자산군 인덱스 + 통합 뉴스 + top 종목 (각 자산군 4-6개).
          # 종목 상세 revalidate=300s 와 cron 5분 정합. KR 종목은 KIS cold start 안정화
          # 위해 더 많이 prefetch (사용자 첫 진입 시 1-3s KIS API 비용 회피).
          pages=(
            "/ko"
            "/ko/news"
            "/ko/crypto" "/ko/us" "/ko/kr"
            # crypto top 4
            "/ko/crypto/btc" "/ko/crypto/eth" "/ko/crypto/sol" "/ko/crypto/xrp"
            # us top 4
            "/ko/us/aapl" "/ko/us/nvda" "/ko/us/tsla" "/ko/us/msft"
            # kr top 6 (KIS cold start 가장 무거움)
            "/ko/kr/005930" "/ko/kr/000660" "/ko/kr/207940"
            "/ko/kr/373220" "/ko/kr/035420" "/ko/kr/035720"
            # 백테스트 default
            "/ko/backtest/new?asset=crypto&symbol=btc"
          )
          for p in "${pages[@]}"; do
            t=$(curl -s -o /dev/null -w "%{time_total}" --max-time 30 "$SITE$p" || echo "TIMEOUT")
            echo "  ${t}s  $p"
          done
