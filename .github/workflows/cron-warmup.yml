name: KV warmup (quotes)

# 매 5분 listQuotes 호출 → KV 캐시 갱신. 대시보드/자산군 인덱스 첫 진입 SSR 11s → ~1s 단축.
# 5분 cron × 24h = 288회/일. BACKFILL_TOKEN 공용.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger /api/cron/warmup
        env:
          BACKFILL_TOKEN: ${{ secrets.BACKFILL_TOKEN }}
          SITE: https://trading.jdgrid.com
        run: |
          set -euo pipefail
          if [ -z "${BACKFILL_TOKEN:-}" ]; then
            echo "::error::BACKFILL_TOKEN secret is missing"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w "%{http_code}" \
                      -X POST "$SITE/api/cron/warmup" \
                      -H "Authorization: Bearer $BACKFILL_TOKEN" \
                      --max-time 120) || code=000
          echo "HTTP $code"
          cat "$body"
          echo
          if [ "$code" != "200" ]; then
            echo "::error::warmup failed with HTTP $code"
            exit 1
          fi

      - name: Prefetch ISR pages (5 main + 9 popular symbol pages)
        env:
          SITE: https://trading.jdgrid.com
        run: |
          # ISR `revalidate = 300` (대시보드/인덱스 4) + `revalidate = 60` (종목 상세) 캐시 갱신.
          # 사용자가 가장 많이 진입하는 페이지만 prefetch — 다른 종목은 첫 진입 사용자가 SSR 트리거.
          pages=(
            "/ko"
            "/ko/crypto" "/ko/us" "/ko/kr"
            "/ko/crypto/btc" "/ko/crypto/eth" "/ko/crypto/sol"
            "/ko/us/aapl" "/ko/us/nvda" "/ko/us/tsla"
            "/ko/kr/005930" "/ko/kr/000660" "/ko/kr/373220"
          )
          for p in "${pages[@]}"; do
            t=$(curl -s -o /dev/null -w "%{time_total}" --max-time 30 "$SITE$p" || echo "TIMEOUT")
            echo "  ${t}s  $p"
          done
